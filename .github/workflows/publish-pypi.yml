name: Build and publish to PyPI

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify the installed wheel
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m venv "$RUNNER_TEMP/qbosdk-wheel"
          "$RUNNER_TEMP/qbosdk-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          qbosdk-wheel/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from qbosdk import AccountingClient, OAuthClient, WebhookVerifier

          tag = os.environ.get("RELEASE_TAG", "")
          if tag and tag != f"v{version('qbosdkonline')}":
              raise SystemExit("Release tag must match the package version.")
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
